<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Coin Collector</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@400;500;600;700;900&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="bg">
    <div class="grid3d"></div>
    <div class="orb o1"></div>
    <div class="orb o2"></div>
    <div class="orb o3"></div>
  </div>
  <div id="vig"></div>
  <div id="flash"></div>

  <button id="btnSound" title="Toggle Audio FX"><span id="sIco">&#9834;</span></button>

  <div id="appWrapper">
    <div id="stage">

      <section id="scrHome" class="screen on">
        <div class="home">
          <div class="heroWrap">
            <div class="hero"><span>$</span></div>
            <div class="heroSh"></div>
          </div>
          <h1 id="title"></h1>
          <div class="legend">
            <div class="lg"><div class="lgi sg">$</div><b style="color:#ffc83d">+10</b><small>Coin</small></div>
            <div class="lg"><div class="lgi sc">&#9670;</div><b style="color:#35e8ff">+35</b><small>Gem</small></div>
            <div class="lg"><div class="lgi sb">&#10022;</div><b style="color:#ff4d6d">&minus;20</b><small>Trap</small></div>
          </div>
          <button id="btnPlay" class="btnMain"><span>START GAME</span></button>
          <div class="bestTag"><span style="color:#ffc83d">&#9819;</span> BEST <b id="bestHome">0</b></div>
        </div>
      </section>

      <section id="scrGame" class="screen">
        <div class="gwrap">
          <div class="hud">
            <div class="chip">
              <div class="cIco iG">$</div>
              <div class="cB"><span class="cL">SCORE</span><span class="cV" id="score">0</span></div>
            </div>
            <div id="comboBox"><b id="comboX">x2</b><i>COMBO</i></div>
            <div class="chip chipR">
              <div class="cB cBR"><span class="cL">TIME</span><span class="cV" id="timeVal">30</span></div>
              <div class="cIco iT">&#9201;</div>
            </div>
          </div>
          <div class="tbar"><div id="tfill"></div></div>
          <div id="frame">
            <i class="cor ctl"></i><i class="cor ctr"></i><i class="cor cbl"></i><i class="cor cbr"></i>
            <div id="board"></div>
            <div id="cdOv"><span id="cdTxt">3</span></div>
          </div>
        </div>
      </section>

      <section id="scrEnd" class="screen">
        <div class="rcard">
          <span class="rkick">GAME OVER</span>
          <div class="rscore" id="endScore">0</div>
          <div id="recBadge">&#9733; NEW RECORD &#9733;</div>
          <div class="rstats">
            <div><b id="stCoins">0</b><span>collected</span></div>
            <div><b id="stCombo">x0</b><span>best combo</span></div>
            <div><b id="stAcc">0%</b><span>accuracy</span></div>
          </div>
          <div id="rankBadge">ROOKIE</div>
          <button id="btnAgain" class="btnMain btnSm"><span>PLAY AGAIN</span></button>
          <button id="btnHome" class="btnGhost">back to menu</button>
        </div>
      </section>

    </div>

    <footer id="devFooter">
      <div class="dev-profile">
        <div class="dev-avatar-wrap">
          <div class="dev-avatar">
            <img src="public/FOOTER.jpg"
                 alt="image"
                 onerror="this.src='https://placehold.co/100x100/6d33ff/ffffff?text=DEV'">
          </div>
        </div>
        <div class="dev-meta">
          <div class="dev-name">Amir Mohammad Ahadi</div>
          <div class="dev-role">Front-End Developer</div>
        </div>
      </div>

      </div>
    </footer>
  </div>

  <script src="script.js" defer></script>
</body>
